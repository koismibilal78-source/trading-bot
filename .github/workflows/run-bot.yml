name: Trading Bot

on:
  schedule:
    # كل 15 دقيقة — طابق TIMEFRAME. GitHub قد يؤخر التشغيل بضع دقائق أحيانًا (طبيعي وغير ضار)
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # يسمح بتشغيل يدوي من تبويب Actions لتجربة سريعة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run one bot cycle
        run: npm start
        env:
          USE_TESTNET: ${{ secrets.USE_TESTNET }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_SETTINGS_ID: ${{ secrets.BOT_SETTINGS_ID }}
          SYMBOL: ${{ secrets.SYMBOL }}
          TIMEFRAME: ${{ secrets.TIMEFRAME }}
